name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: JS — lint, format, test (apps/web + apps/api)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/canary_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx eslint .
      - run: npx prettier --check .
      - run: npm test --workspace=apps/api
      - run: npm test --workspace=apps/web
      - run: npm audit --audit-level=high || true

  python:
    name: Python — lint, format, test (apps/intelligence)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/canary_ci
    defaults:
      run:
        working-directory: apps/intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: 'apps/intelligence/.python-version'
      - run: pip install -r requirements.txt
      - run: pip install pip-audit
      - run: ruff check .
      - run: black --check .
      - run: pytest -q
      - run: pip-audit || true
