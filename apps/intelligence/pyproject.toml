[tool.black]
line-length = 110
target-version = ["py313"]
# Agent sandboxes leave permission-locked pytest temp dirs in this tree. Without
# this, `black --check .` CRASHES on them before reaching a single source file —
# so the local check "passes" by never running, and a real formatting error only
# surfaces in CI, where those dirs do not exist. That happened once; excluding
# them keeps the local command equivalent to the CI one.
force-exclude = '''
/(
    venv
  | \.venv
  | \.pytest-tmp
  | \.pytest-task6
  | \.test-tmp
  | \.codex-pytest-tmp
)/
'''

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = [
    "venv",
    ".pytest-tmp",
    ".pytest-task6",
    ".test-tmp",
    ".codex-pytest-tmp",
]

[tool.ruff.lint]
# "I" = import sorting. Ruff's own isort-equivalent replaces standalone isort —
# running both risks the two disagreeing on edge cases; Ruff's docs recommend
# this consolidation. Black stays for formatting (Ruff doesn't format).
select = ["E", "F", "W", "I", "UP", "B"]
ignore = []
